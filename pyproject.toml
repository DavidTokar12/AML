[project]
name = "aml"
version = "0.1.0"
description = "ETH Advanced Machine Learning 2026 - Project 1"
readme = "README.md"
authors = [{ name = "David Tokar", email = "1413david@gmail.com" }]
requires-python = ">=3.12"
dependencies = [
    "kagglehub",
    "numpy",
    "pandas",
    "python-dotenv",
    "scikit-learn>=1.6",
]

[project.scripts]
train = "aml.train:main"
tune = "aml.tune:main"
importance = "aml.importance:main"

[dependency-groups]
dev = [
    "ipykernel",
    "matplotlib",
    "ruff",
    "seaborn",
]

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"

[tool.ruff]
fix = true
line-length = 88
target-version = "py312"

[tool.ruff.lint]
extend-select = [
    "B",    # bugbear
    "C4",   # comprehensions
    "I",    # isort
    "N",    # pep8-naming
    "PIE",  # flake8-pie
    "PGH",  # pygrep
    "RUF",  # ruff checks
    "SIM",  # simplify
    "TC",   # type-checking imports
    "TID",  # tidy-imports
    "UP",   # pyupgrade
]
ignore = [
    "N803", # allow X as an argument name (ML convention)
    "N806", # allow X as a variable name (ML convention)
    "TC001",
    "TC002",
    "TC003",
]
extend-safe-fixes = ["TC"]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.ruff.lint.isort]
force-single-line = true
lines-between-types = 1
lines-after-imports = 2
known-first-party = ["aml"]
